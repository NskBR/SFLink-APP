[package]
name = "wifi-files"
version = "0.3.1"
edition = "2021"

[lib]
name = "wifi_files_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
trash = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures-util = "0.3"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security_Cryptography"] }

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "webp"]

[dependencies.rqrr]
version = "0.10"

[dependencies.sha2]
version = "0.10"

[dependencies.getrandom]
version = "0.3"

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
